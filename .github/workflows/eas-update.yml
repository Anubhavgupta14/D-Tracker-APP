name: EAS Update (preview)

# Publishes an over-the-air update to installed apps on every push to main.
#
# IMPORTANT, read once:
#  - OTA only ships JS / asset changes. Native changes (new permissions, new
#    native modules, the FCM / push setup) still need a fresh build she installs;
#    this workflow can't deliver those.
#  - An update only reaches a build that was made from a profile with
#    "channel": "preview" (see eas.json) and the SAME runtimeVersion. If you bump
#    `version` in app.json you must ship a new build before OTA works again.
#  - Requires two one-time setup steps (see docs/ADMIN_SERVER.md "OTA" + the chat):
#      1. A GitHub repo secret EXPO_TOKEN (expo.dev → settings → access tokens).
#      2. EXPO_PUBLIC_API_URL stored as an EAS env var for the `preview`
#         environment, or the bundle ships without your server URL:
#         eas env:set --name EXPO_PUBLIC_API_URL \
#           --value https://dhruvi18.vercel.app \
#           --environment preview --visibility plaintext

on:
  push:
    branches: [main]
    # Don't waste an update on changes that never reach the app bundle.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"
  workflow_dispatch: {}

concurrency:
  group: eas-update-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Set the EXPO_TOKEN secret in the repo (Settings → Secrets → Actions)." && exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        # Android only: without --platform it also exports web, which needs react-native-web.
        run: eas update --channel preview --environment preview --platform android --message "${{ github.event.head_commit.message || format('manual update {0}', github.sha) }}"
